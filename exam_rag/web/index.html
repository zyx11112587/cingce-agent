<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>考公 RAG 真题库</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --panel: #ffffff;
      --ink: #18212b;
      --muted: #647180;
      --line: #dbe2e8;
      --accent: #126b75;
      --accent-soft: #e4f3f2;
      --warning: #9a5b00;
      --shadow: 0 10px 28px rgba(24, 33, 43, .07);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background:
        linear-gradient(180deg, #eaf3f3 0, rgba(234, 243, 243, 0) 250px),
        var(--bg);
      font: 15px/1.65 "Microsoft YaHei", "PingFang SC", sans-serif;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      padding: 26px max(20px, calc((100vw - 1240px) / 2));
      border-bottom: 1px solid rgba(18, 107, 117, .14);
      background: rgba(255, 255, 255, .72);
      backdrop-filter: blur(12px);
    }

    h1 { margin: 0; font-size: 24px; letter-spacing: 0; }
    .subtitle { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
    .status { color: var(--muted); font-size: 13px; text-align: right; }

    main {
      width: min(1240px, calc(100% - 40px));
      margin: 26px auto 60px;
    }

    .search-panel {
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .mode-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .mode {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--muted);
      padding: 8px 13px;
      border-radius: 6px;
      cursor: pointer;
      font: inherit;
    }

    .mode.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 700;
    }

    .search-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
    }

    input, button {
      font: inherit;
    }

    input {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 11px;
      color: var(--ink);
      background: #fff;
    }

    input:focus {
      outline: 2px solid rgba(18, 107, 117, .18);
      border-color: var(--accent);
    }

    .primary {
      border: 1px solid var(--accent);
      border-radius: 6px;
      padding: 8px 22px;
      background: var(--accent);
      color: white;
      cursor: pointer;
      min-width: 108px;
    }

    .filters {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-top: 12px;
    }

    .filters label {
      color: var(--muted);
      font-size: 12px;
    }

    .filters input {
      min-height: 36px;
      margin-top: 3px;
      font-size: 13px;
    }

    .meta-line {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
      color: var(--muted);
      font-size: 13px;
    }

    .badge {
      display: inline-block;
      padding: 1px 7px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fafbfc;
      color: var(--muted);
      font-size: 12px;
    }

    .result-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(300px, .8fr);
      gap: 18px;
      margin-top: 18px;
      align-items: start;
    }

    .answer, .result {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    .answer {
      padding: 18px;
      white-space: pre-wrap;
      line-height: 1.8;
    }

    .answer h2, .answer h3 { margin: 0 0 8px; font-size: 17px; }
    .answer.small { font-size: 14px; }

    .results {
      display: grid;
      gap: 12px;
    }

    .result { padding: 16px; }
    .result h3 { margin: 0 0 8px; font-size: 16px; line-height: 1.5; }
    .result p { margin: 6px 0; }
    .muted { color: var(--muted); }
    .answer-text { white-space: pre-wrap; }
    .source { color: #475569; font-size: 12px; word-break: break-all; }
    .empty { padding: 30px; color: var(--muted); text-align: center; }
    .error { color: #a12727; }

    .images {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .images img {
      max-width: min(100%, 360px);
      max-height: 220px;
      object-fit: contain;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: #fff;
    }

    @media (max-width: 880px) {
      .result-layout { grid-template-columns: 1fr; }
      .filters { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 560px) {
      .topbar { align-items: flex-start; flex-direction: column; }
      .status { text-align: left; }
      .search-row { grid-template-columns: 1fr; }
      .primary { min-height: 42px; }
      .filters { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div>
      <h1>考公 RAG 真题库</h1>
      <p class="subtitle">真题检索 · 考点问答 · 解析查询</p>
    </div>
    <div id="status" class="status">正在读取索引状态...</div>
  </header>

  <main>
    <section class="search-panel">
      <div class="mode-row" role="tablist" aria-label="问答模式">
        <button class="mode active" data-mode="search" type="button">真题检索</button>
        <button class="mode" data-mode="knowledge" type="button">考点问答</button>
        <button class="mode" data-mode="explain" type="button">解析查询</button>
      </div>
      <form id="search-form">
        <div class="search-row">
          <input id="query" name="query" autocomplete="off"
                 placeholder="输入题干、关键词、qid 或自然语言问题">
          <button class="primary" type="submit">开始查询</button>
        </div>
        <div class="filters">
          <label>年份
            <input id="year" name="year" placeholder="例如 2023">
          </label>
          <label>科目
            <input id="subject" name="subject" placeholder="例如 判断推理">
          </label>
          <label>地区
            <input id="region" name="region" placeholder="例如 国家">
          </label>
          <label>返回数量
            <input id="top-k" name="top_k" type="number" min="1" max="20" value="5">
          </label>
        </div>
      </form>
      <div id="meta" class="meta-line"></div>
    </section>

    <section class="result-layout">
      <div id="answer" class="answer" hidden></div>
      <div id="results" class="results">
        <div class="empty">输入问题后开始检索。</div>
      </div>
    </section>
  </main>

  <script>
    const state = { mode: "search" };
    const $ = (id) => document.getElementById(id);

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function setStatus(text, error = false) {
      const el = $("status");
      el.textContent = text;
      el.classList.toggle("error", error);
    }

    async function loadStatus() {
      try {
        const response = await fetch("/api/stats");
        const stats = await response.json();
        setStatus(`题目 ${stats.questions} · 文档块 ${stats.chunks} · 图片 ${stats.images}`);
      } catch (error) {
        setStatus("索引尚未就绪", true);
      }
    }

    function filters() {
      return {
        year: $("year").value.trim(),
        subject: $("subject").value.trim(),
        region: $("region").value.trim()
      };
    }

    function renderImages(images) {
      if (!images || !images.length) return "";
      return `<div class="images">${images.map((image) =>
        `<img src="${escapeHtml(image.url)}" alt="${escapeHtml(image.alt)}" loading="lazy">`
      ).join("")}</div>`;
    }

    function renderHit(hit, index) {
      const question = hit.question;
      const text = question?.stem || hit.chunk?.text || "";
      const answer = question?.answer || "";
      const explanation = question?.explanation || hit.chunk?.text || "";
      const source = hit.chunk?.source_rel || "";
      const meta = [
        question?.year ? `<span class="badge">${escapeHtml(question.year)}</span>` : "",
        question?.subject ? `<span class="badge">${escapeHtml(question.subject)}</span>` : "",
        question?.question_type ? `<span class="badge">${escapeHtml(question.question_type)}</span>` : "",
        hit.chunk?.chunk_type ? `<span class="badge">${escapeHtml(hit.chunk.chunk_type)}</span>` : ""
      ].join("");
      return `
        <article class="result">
          <h3>${index + 1}. ${escapeHtml(text || "未识别题干")}</h3>
          <div class="meta-line">${meta}<span class="muted">score ${escapeHtml(hit.score)}</span></div>
          ${answer ? `<p><strong>答案：</strong>${escapeHtml(answer)}</p>` : ""}
          ${explanation ? `<p class="muted answer-text">${escapeHtml(explanation.slice(0, 900))}</p>` : ""}
          <p class="source">来源：${escapeHtml(source)}</p>
          ${renderImages(hit.images)}
        </article>
      `;
    }

    function renderAnswer(payload) {
      const el = $("answer");
      el.hidden = false;
      el.classList.add("small");
      const citations = (payload.citations || []).map((item) =>
        `<div class="source">- ${escapeHtml(item.source_rel)} · qid=${escapeHtml(item.qid)}</div>`
      ).join("");
      el.innerHTML = `
        <pre class="answer-text">${escapeHtml(payload.answer || "")}</pre>
        ${citations ? `<h3>来源</h3>${citations}` : ""}
        ${payload.llm_error ? `<p class="error">LLM 调用失败，已回退到原文模式：${escapeHtml(payload.llm_error)}</p>` : ""}
      `;
    }

    async function submitQuery(event) {
      event.preventDefault();
      const query = $("query").value.trim();
      if (!query) return;
      setStatus("检索中...");
      $("answer").hidden = true;
      $("results").innerHTML = '<div class="empty">检索中...</div>';
      $("meta").textContent = "";

      const topK = Number($("top-k").value || 5);
      try {
        if (state.mode === "search") {
          const params = new URLSearchParams({
            q: query,
            mode: "search",
            top_k: String(topK),
            ...filters()
          });
          const response = await fetch(`/api/search?${params.toString()}`);
          const payload = await response.json();
          if (!response.ok) throw new Error(payload.error || "查询失败");
          const hits = payload.hits || [];
          $("meta").textContent = `检索到 ${hits.length} 条结果`;
          $("results").innerHTML = hits.length
            ? hits.map(renderHit).join("")
            : '<div class="empty">没有找到匹配资料。</div>';
        } else {
          const response = await fetch("/api/qa", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              question: query,
              mode: state.mode,
              top_k: topK,
              filters: filters()
            })
          });
          const payload = await response.json();
          if (!response.ok) throw new Error(payload.error || "问答失败");
          renderAnswer(payload);
          const hits = payload.hits || [];
          $("meta").textContent = `证据 ${hits.length} 条 · 置信度 ${payload.confidence || "unknown"}`;
          $("results").innerHTML = hits.length
            ? hits.map(renderHit).join("")
            : '<div class="empty">没有找到匹配资料。</div>';
        }
        setStatus("索引可用");
      } catch (error) {
        $("results").innerHTML = `<div class="empty error">${escapeHtml(error.message)}</div>`;
        setStatus("查询失败", true);
      }
    }

    document.querySelectorAll(".mode").forEach((button) => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".mode").forEach((item) => item.classList.remove("active"));
        button.classList.add("active");
        state.mode = button.dataset.mode;
        $("query").placeholder = state.mode === "explain"
          ? "粘贴题干，或输入 qid"
          : "输入题干、关键词或自然语言问题";
      });
    });
    $("search-form").addEventListener("submit", submitQuery);
    loadStatus();
  </script>
</body>
</html>
